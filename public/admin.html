<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cards Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:     #0c0a08;
  --s1:     #131008;
  --s2:     #1c1810;
  --s3:     #252018;
  --bdr:    #2e2818;
  --bdr2:   #3a3020;
  --gold:   #e8a020;
  --gold2:  #c88010;
  --gold-d: rgba(232,160,32,.12);
  --gold-g: rgba(232,160,32,.05);
  --red:    #e84030;
  --red-d:  rgba(232,64,48,.12);
  --grn:    #2db870;
  --txt:    #f0ece6;
  --t2:     #907868;
  --t3:     #504038;
  --mono:   'IBM Plex Mono', 'Courier New', monospace;
  --sans:   'Inter', system-ui, sans-serif;
  --serif:  'Playfair Display', Georgia, serif;
}
html,body{background:var(--bg);color:var(--txt);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── LOGIN ── */
#loginScreen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(232,160,32,.06) 0%, transparent 60%);
}
.login-wrap{width:100%;max-width:400px;padding:20px}
.login-eyebrow{
  font-family:var(--mono);font-size:10px;font-weight:500;
  letter-spacing:3px;text-transform:uppercase;color:var(--gold);
  margin-bottom:12px;
}
.login-brand{
  font-family:var(--serif);font-size:36px;font-weight:700;
  color:var(--txt);line-height:1.1;margin-bottom:6px;
}
.login-sub{font-size:13px;color:var(--t2);margin-bottom:36px;line-height:1.6}
.login-label{font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--t2);margin-bottom:8px;display:block}
.login-input{
  width:100%;height:52px;background:var(--s1);
  border:1px solid var(--bdr2);border-radius:4px;
  padding:0 18px;font-size:14px;font-family:var(--mono);
  color:var(--txt);letter-spacing:2px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.login-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-d)}
.login-input::placeholder{letter-spacing:0;color:var(--t3);font-family:var(--sans)}
.login-btn{
  width:100%;height:52px;margin-top:14px;
  background:var(--gold);border:none;border-radius:4px;
  color:#0c0a08;font-size:13px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;
  cursor:pointer;font-family:var(--sans);
  transition:background .15s,box-shadow .2s;
  box-shadow:0 4px 24px rgba(232,160,32,.25);
}
.login-btn:hover{background:var(--gold2);box-shadow:0 6px 32px rgba(232,160,32,.35)}
.login-err{font-size:12px;color:var(--red);margin-top:12px;display:none;font-family:var(--mono)}

/* ── MAIN ── */
#mainScreen{display:none}

/* ── HEADER ── */
.hd{
  border-bottom:1px solid var(--bdr);
  padding:0 40px;
  background:linear-gradient(180deg, var(--s1) 0%, var(--bg) 100%);
}
.hd-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 0 16px;border-bottom:1px solid var(--bdr);
}
.hd-brand{display:flex;align-items:baseline;gap:14px}
.hd-name{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1;letter-spacing:-.3px}
.hd-tag{
  font-family:var(--mono);font-size:9px;font-weight:500;
  letter-spacing:2.5px;text-transform:uppercase;
  color:var(--gold);border:1px solid rgba(232,160,32,.3);
  border-radius:3px;padding:3px 8px;
}
.hd-right{display:flex;align-items:center;gap:12px}
.btn-logout{
  background:none;border:1px solid var(--bdr2);border-radius:3px;
  color:var(--t2);font-size:12px;font-weight:500;padding:7px 16px;
  cursor:pointer;font-family:var(--sans);letter-spacing:.3px;
  transition:all .15s;
}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

/* stats strip */
.hd-stats{display:flex;padding:18px 0}
.hd-stat{flex:1;padding:0 24px;border-right:1px solid var(--bdr)}
.hd-stat:first-child{padding-left:0}
.hd-stat:last-child{border-right:none}
.hd-stat-lbl{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.hd-stat-val{font-family:var(--mono);font-size:24px;font-weight:500;color:var(--txt)}
.hd-stat.hi .hd-stat-val{color:var(--gold)}
.hd-stat.g  .hd-stat-val{color:var(--grn)}

/* ── CONTENT ── */
.content{padding:32px 40px;max-width:1240px}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:240px}
.search-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
.search-input{
  width:100%;height:42px;background:var(--s1);
  border:1px solid var(--bdr);border-radius:3px;
  padding:0 14px 0 40px;font-size:13px;color:var(--txt);
  font-family:var(--sans);outline:none;
  transition:border-color .2s;
}
.search-input:focus{border-color:var(--gold)}
.search-input::placeholder{color:var(--t3)}

.btn-tb{
  height:42px;padding:0 18px;background:var(--s1);
  border:1px solid var(--bdr);border-radius:3px;
  color:var(--t2);font-size:12px;font-weight:600;
  letter-spacing:.4px;cursor:pointer;font-family:var(--sans);
  display:flex;align-items:center;gap:7px;
  transition:all .15s;white-space:nowrap;
}
.btn-tb:hover{border-color:var(--bdr2);color:var(--txt)}
.btn-tb.gold{border-color:rgba(232,160,32,.4);color:var(--gold);background:var(--gold-g)}
.btn-tb.gold:hover{background:var(--gold-d);border-color:var(--gold)}
.btn-tb.red{border-color:rgba(232,64,48,.3);color:var(--red);background:rgba(232,64,48,.04)}
.btn-tb.red:hover{background:var(--red-d)}

/* table */
.tbl-wrap{background:var(--s1);border:1px solid var(--bdr);border-radius:4px;overflow:hidden}
.tbl-head{
  display:grid;grid-template-columns:.4fr 2fr 1.2fr 110px 100px 100px 150px 90px;
  padding:10px 20px;border-bottom:1px solid var(--bdr);
  font-size:10px;font-weight:600;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--t3);
}
.tbl-body{max-height:calc(100vh - 320px);overflow-y:auto}
.tbl-body::-webkit-scrollbar{width:3px}
.tbl-body::-webkit-scrollbar-track{background:transparent}
.tbl-body::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}

.tbl-row{
  display:grid;grid-template-columns:.4fr 2fr 1.2fr 110px 100px 100px 150px 90px;
  padding:13px 20px;border-bottom:1px solid var(--bdr);
  align-items:center;cursor:default;
  border-left:2px solid transparent;
  transition:background .1s,border-left-color .1s;
}
.tbl-row:last-child{border-bottom:none}
.tbl-row:hover{background:var(--s2);border-left-color:var(--gold)}

.row-n{font-family:var(--mono);font-size:11px;color:var(--t3);font-weight:500}
.cell{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cell-name{font-weight:600;font-size:13px}
.cell-sub{font-size:11px;color:var(--t2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-cpf{font-family:var(--mono);font-size:11px;color:var(--t2);letter-spacing:.5px}

.brand-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--s2);border:1px solid var(--bdr2);
  border-radius:3px;padding:3px 8px;
}
.brand-tag img{height:16px;object-fit:contain}
.brand-tag .bt{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--t2)}

.last4{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:1.5px}
.last4-mask{color:var(--t3);margin-right:4px}

.exp-tag{
  display:inline-flex;align-items:center;gap:4px;
  font-family:var(--mono);font-size:12px;font-weight:500;
  padding:2px 8px;border-radius:3px;
}
.exp-ok  {background:rgba(45,184,112,.08);color:var(--grn);border:1px solid rgba(45,184,112,.2)}
.exp-warn{background:rgba(232,160,32,.1);color:var(--gold);border:1px solid rgba(232,160,32,.2)}

.date-c{font-family:var(--mono);font-size:11px;color:var(--t2)}

.row-acts{display:flex;gap:5px;align-items:center}
.btn-act{
  width:30px;height:30px;background:none;
  border:1px solid var(--bdr2);border-radius:3px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--t3);transition:all .15s;flex-shrink:0;
}
.btn-act:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-g)}
.btn-act.del:hover{border-color:var(--red);color:var(--red);background:var(--red-d)}

/* empty */
.empty{padding:60px;text-align:center;color:var(--t3)}
.empty-ico{font-size:32px;opacity:.3;margin-bottom:10px}
.empty-lbl{font-size:13px;font-weight:500}

/* ── DETAIL MODAL ── */
#detailModal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.8);z-index:200;
  align-items:center;justify-content:center;
  backdrop-filter:blur(10px);padding:20px;
}
#detailModal.show{display:flex}
.detail-box{
  background:var(--s1);border:1px solid var(--bdr2);
  border-radius:4px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
  box-shadow:0 40px 100px rgba(0,0,0,.7),0 0 0 1px rgba(232,160,32,.06);
  animation:pop .22s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.detail-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 24px;border-bottom:1px solid var(--bdr);
}
.detail-title{
  font-family:var(--mono);font-size:11px;font-weight:500;
  letter-spacing:2px;text-transform:uppercase;color:var(--gold);
  display:flex;align-items:center;gap:8px;
}
.detail-close{
  width:30px;height:30px;background:var(--s2);
  border:1px solid var(--bdr2);border-radius:3px;
  color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-family:var(--sans);transition:all .15s;
}
.detail-close:hover{border-color:var(--red);color:var(--red)}

/* Visual card */
.vc-wrap{padding:20px 24px 0}
.vc{
  background:linear-gradient(140deg,#1a1408 0%,#0e0c06 50%,#1a1000 100%);
  border-radius:8px;padding:26px 28px;position:relative;overflow:hidden;
  min-height:170px;
  border:1px solid rgba(232,160,32,.15);
  box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(232,160,32,.08);
}
.vc::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,160,32,.1),transparent 70%);
}
.vc-brand{position:absolute;top:20px;right:24px;z-index:1}
.vc-brand img{height:30px;object-fit:contain}
.vc-brand .btext{font-size:11px;color:rgba(255,255,255,.4);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.vc-chip{
  width:44px;height:32px;margin-bottom:22px;position:relative;z-index:1;border-radius:5px;
  background:linear-gradient(135deg,#b8860b,#f0c040,#b8860b);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
}
.vc-num{
  font-family:var(--mono);font-size:17px;font-weight:500;
  letter-spacing:3px;color:#fff;margin-bottom:18px;
  position:relative;z-index:1;display:flex;gap:18px;
}
.vc-num span.masked{opacity:.3}
.vc-bot{
  display:flex;align-items:flex-end;justify-content:space-between;
  position:relative;z-index:1;
}
.vc-lbl{font-family:var(--mono);font-size:8px;color:rgba(232,160,32,.5);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px}
.vc-val{font-family:var(--mono);font-size:12px;font-weight:500;color:rgba(255,255,255,.9);letter-spacing:2px}
.vc-name{font-family:var(--mono);font-size:12px;font-weight:500;color:rgba(255,255,255,.9);letter-spacing:2px;text-transform:uppercase}
.vc-badges{display:flex;gap:6px;margin-top:12px}
.vc-badge{font-family:var(--mono);font-size:9px;font-weight:500;padding:3px 10px;border-radius:3px;letter-spacing:1px;text-transform:uppercase}
.badge-level{background:rgba(232,160,32,.12);color:var(--gold);border:1px solid rgba(232,160,32,.2)}
.badge-type {background:rgba(45,184,112,.1); color:var(--grn); border:1px solid rgba(45,184,112,.2)}
.badge-bank {background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1)}

/* Info grid */
.detail-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:18px 24px 24px}
.df{display:flex;flex-direction:column;gap:4px}
.df-lbl{font-family:var(--mono);font-size:9px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:1.2px}
.df-val{
  font-family:var(--mono);font-size:12px;color:var(--txt);
  background:var(--s2);border:1px solid var(--bdr);border-radius:3px;
  padding:8px 12px;word-break:break-all;line-height:1.5;
}
.df-val.hi{color:var(--gold)}
.df-copy{
  display:inline-flex;align-items:center;gap:4px;margin-top:3px;
  background:none;border:1px solid var(--bdr);border-radius:3px;
  color:var(--t3);font-size:10px;font-family:var(--mono);
  padding:2px 8px;cursor:pointer;transition:all .15s;width:fit-content;
}
.df-copy:hover{border-color:var(--t2);color:var(--txt)}
.df-copy.ok{border-color:var(--grn);color:var(--grn)}
.df-full{grid-column:1/-1}
.df-half{grid-column:span 2}

/* ── CONFIRM ── */
#confirmModal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.7);z-index:300;
  align-items:center;justify-content:center;
  backdrop-filter:blur(6px);
}
#confirmModal.show{display:flex}
.confirm-box{
  background:var(--s1);border:1px solid var(--bdr2);
  border-radius:4px;padding:32px 28px;
  width:100%;max-width:340px;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
  animation:pop .22s cubic-bezier(.34,1.56,.64,1);
}
.confirm-ico{font-size:32px;margin-bottom:14px;display:block}
.confirm-title{font-size:16px;font-weight:700;margin-bottom:8px}
.confirm-sub{font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:24px}
.confirm-btns{display:flex;gap:10px}
.confirm-cancel{
  flex:1;height:46px;background:none;border:1px solid var(--bdr2);
  border-radius:3px;color:var(--t2);font-size:13px;font-weight:600;
  cursor:pointer;font-family:var(--sans);transition:all .15s;
}
.confirm-cancel:hover{color:var(--txt);border-color:var(--bdr2)}
.confirm-ok{
  flex:1;height:46px;background:var(--red);border:none;
  border-radius:3px;color:#fff;font-size:13px;font-weight:700;
  cursor:pointer;font-family:var(--sans);
  box-shadow:0 4px 16px rgba(232,64,48,.3);transition:opacity .15s;
}
.confirm-ok:hover{opacity:.88}

@media(max-width:900px){
  .tbl-head,.tbl-row{grid-template-columns:.4fr 2fr 100px 80px 90px}
  .col-cpf,.col-date,.col-brand{display:none}
  .hd,.content{padding-left:20px;padding-right:20px}
  .hd-stats{overflow-x:auto}
  .hd-stat{min-width:120px}
}
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="loginScreen">
  <div class="login-wrap">
    <div class="login-eyebrow">Acesso Restrito</div>
    <div class="login-brand">Cards Vault</div>
    <div class="login-sub">Insira o token de administrador para continuar.</div>
    <label class="login-label">Token de acesso</label>
    <input class="login-input" type="password" id="tokenInput" placeholder="••••••••••••" onkeydown="if(event.key==='Enter')login()"/>
    <button class="login-btn" onclick="login()">Entrar</button>
    <div class="login-err" id="loginErr">// token inválido</div>
  </div>
</div>

<!-- ── MAIN ── -->
<div id="mainScreen">

  <div class="hd">
    <div class="hd-top">
      <div class="hd-brand">
        <span class="hd-name">Cards Vault</span>
        <span class="hd-tag">Admin</span>
      </div>
      <div class="hd-right">
        <button class="btn-logout" onclick="logout()">Sair</button>
      </div>
    </div>
    <div class="hd-stats">
      <div class="hd-stat hi">
        <div class="hd-stat-lbl">Total de cartões</div>
        <div class="hd-stat-val" id="statTotal">—</div>
      </div>
      <div class="hd-stat g">
        <div class="hd-stat-lbl">Últimas 24h</div>
        <div class="hd-stat-val" id="statLast24">—</div>
      </div>
      <div class="hd-stat">
        <div class="hd-stat-lbl" id="sb1l">—</div>
        <div class="hd-stat-val" id="sb1v">0</div>
      </div>
      <div class="hd-stat">
        <div class="hd-stat-lbl" id="sb2l">—</div>
        <div class="hd-stat-val" id="sb2v">0</div>
      </div>
    </div>
  </div>

  <div class="content">

    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-ico" width="14" height="14" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
          <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input class="search-input" id="searchInput" placeholder="Buscar nome, e-mail, bandeira, final…" oninput="debounceSearch()"/>
      </div>
      <button class="btn-tb" onclick="loadAll()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
          <path d="M1 4v6h6M23 20v-6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Atualizar
      </button>
      <button class="btn-tb gold" id="btnExport" onclick="exportarCartoes()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
          <path d="M12 15V4M12 15l-4-4M12 15l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 17v1a2 2 0 002 2h12a2 2 0 002-2v-1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Exportar .txt
      </button>
      <button class="btn-tb red" onclick="confirmClearAll()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
          <polyline points="3 6 5 6 21 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 6V4h6v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Limpar tudo
      </button>
    </div>

    <div class="tbl-wrap">
      <div class="tbl-head">
        <div>#</div>
        <div>Nome / E-mail</div>
        <div class="col-cpf">CPF</div>
        <div class="col-brand">Bandeira</div>
        <div>Final</div>
        <div>Validade</div>
        <div class="col-date">Cadastrado em</div>
        <div></div>
      </div>
      <div class="tbl-body" id="tableBody">
        <div class="empty"><div class="empty-ico">💳</div><div class="empty-lbl">Carregando…</div></div>
      </div>
    </div>

  </div>
</div>

<!-- ── DETAIL MODAL ── -->
<div id="detailModal" onclick="if(event.target===this)closeDetail()">
  <div class="detail-box">
    <div class="detail-hd">
      <div class="detail-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <rect x="1" y="4" width="22" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M1 10h22" stroke="currentColor" stroke-width="2"/>
        </svg>
        Dados do cartão
      </div>
      <button class="detail-close" onclick="closeDetail()">×</button>
    </div>
    <div id="detailCardWrap" class="vc-wrap"></div>
    <div class="detail-grid" id="detailGrid"></div>
  </div>
</div>

<!-- ── CONFIRM ── -->
<div id="confirmModal">
  <div class="confirm-box">
    <span class="confirm-ico" id="cIco">⚠️</span>
    <div class="confirm-title" id="cTitle">Confirmar</div>
    <div class="confirm-sub" id="cSub"></div>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="closeConfirm()">Cancelar</button>
      <button class="confirm-ok" id="cOk">Confirmar</button>
    </div>
  </div>
</div>

<script>
const BRAND_LOGOS = {
  visa:       'https://cdn.jsdelivr.net/gh/aaronfagan/svg-credit-card-payment-icons/flat/visa.svg',
  mastercard: 'https://cdn.jsdelivr.net/gh/aaronfagan/svg-credit-card-payment-icons/flat/mastercard.svg',
  amex:       'https://cdn.jsdelivr.net/gh/aaronfagan/svg-credit-card-payment-icons/flat/amex.svg',
  elo:        'https://cdn.jsdelivr.net/gh/aaronfagan/svg-credit-card-payment-icons/flat/elo.svg',
  hipercard:  'https://cdn.jsdelivr.net/gh/aaronfagan/svg-credit-card-payment-icons/flat/hipercard.svg',
  maestro:    'https://cdn.jsdelivr.net/gh/aaronfagan/svg-credit-card-payment-icons/flat/maestro.svg',
};

let _token = localStorage.getItem('cv_token') || '';
let _searchTimer = null;
const _cards = {};
let _rowIndex = 0;

async function login() {
  const t = document.getElementById('tokenInput').value.trim();
  if (!t) return;
  const r = await fetch('/api/admin/stats', { headers: { 'x-admin-token': t } });
  if (r.ok) {
    _token = t; localStorage.setItem('cv_token', t);
    document.getElementById('loginErr').style.display = 'none';
    showMain();
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
}
function logout() {
  _token = ''; localStorage.removeItem('cv_token');
  document.getElementById('mainScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}
function showMain() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'block';
  loadAll();
}
if (_token) {
  fetch('/api/admin/stats', { headers: { 'x-admin-token': _token } })
    .then(r => r.ok ? showMain() : logout()).catch(() => {});
}

async function loadAll() { await Promise.all([loadStats(), loadCards()]); }

async function loadStats() {
  const r = await fetch('/api/admin/stats', { headers: { 'x-admin-token': _token } });
  if (!r.ok) return;
  const d = await r.json();
  document.getElementById('statTotal').textContent  = d.total;
  document.getElementById('statLast24').textContent = d.last24;
  const brands = d.brands || [];
  [[0,'sb1l','sb1v'],[1,'sb2l','sb2v']].forEach(([i,l,v]) => {
    const b = brands[i];
    document.getElementById(l).textContent = b ? b.brand.charAt(0).toUpperCase()+b.brand.slice(1) : '—';
    document.getElementById(v).textContent = b ? b.count : '0';
  });
}

async function loadCards(search) {
  const q = search ? '?search='+encodeURIComponent(search) : '';
  const r = await fetch('/api/admin/cards'+q, { headers: { 'x-admin-token': _token } });
  if (!r.ok) return;
  const d = await r.json();
  renderTable(d.cards || []);
}
function debounceSearch() {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => loadCards(document.getElementById('searchInput').value.trim() || undefined), 350);
}

function renderTable(cards) {
  const body = document.getElementById('tableBody');
  if (!cards.length) {
    body.innerHTML = '<div class="empty"><div class="empty-ico">💳</div><div class="empty-lbl">Nenhum cartão cadastrado</div></div>';
    return;
  }
  _rowIndex = 0;
  cards.forEach(c => _cards[c.id] = c);
  body.innerHTML = cards.map((c, i) => {
    const brandHtml = BRAND_LOGOS[c.brand]
      ? `<span class="brand-tag col-brand"><img src="${BRAND_LOGOS[c.brand]}" alt="${c.brand}"/></span>`
      : `<span class="brand-tag col-brand"><span class="bt">${c.brand||'?'}</span></span>`;
    const expParts = (c.expiry||'').split('/');
    let expClass = 'exp-ok';
    if (expParts.length===2) {
      const m=parseInt(expParts[0]), y=parseInt('20'+expParts[1]);
      const now=new Date();
      if ((y-now.getFullYear())*12+(m-now.getMonth()-1)<=3) expClass='exp-warn';
    }
    const date = c.created_at
      ? new Date(c.created_at).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})
      : '—';
    return `<div class="tbl-row">
      <div class="row-n">${String(i+1).padStart(2,'0')}</div>
      <div class="cell"><div class="cell-name">${esc(c.nome||'—')}</div><div class="cell-sub">${esc(c.email||'—')}</div></div>
      <div class="cell col-cpf cell-cpf">${esc(c.cpf||'—')}</div>
      ${brandHtml}
      <div class="cell"><span class="last4"><span class="last4-mask">••••</span>${esc(c.last4)}</span></div>
      <div class="cell"><span class="exp-tag ${expClass}">${esc(c.expiry)}</span></div>
      <div class="cell col-date date-c">${date}</div>
      <div class="cell row-acts">
        <button class="btn-act" onclick="openDetail('${c.id}')" title="Ver dados">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
            <path d="M1 12C3.4 7 7.3 4 12 4s8.6 3 11 8c-2.4 5-6.3 8-11 8S3.4 17 1 12z" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </button>
        <button class="btn-act del" onclick="confirmDelete('${esc(c.id)}','${esc(c.nome||'este cartão')}')" title="Deletar">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
            <polyline points="3 6 5 6 21 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M9 6V4h6v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>`;
  }).join('');
}

function openDetail(id) {
  const c = _cards[id]; if (!c) return;
  const brandLogo = BRAND_LOGOS[c.brand]
    ? `<img src="${BRAND_LOGOS[c.brand]}" alt="${c.brand||''}" />`
    : `<span class="btext">${esc(c.brand||'CARD')}</span>`;
  const rawNum = (c.card_number||'').replace(/\D/g,'');
  let numDisplay = '';
  if (rawNum.length >= 12) {
    numDisplay = (rawNum.match(/.{1,4}/g)||[]).map(ch=>`<span>${ch}</span>`).join('');
  } else {
    numDisplay = `<span class="masked">••••</span><span class="masked">••••</span><span class="masked">••••</span><span>${esc(c.last4||'????')}</span>`;
  }
  const lvlStr = (c.card_level||'').toLowerCase();
  const LEVELS = [['platinum','PLATINUM'],['gold','GOLD'],['infinite','INFINITE'],['black','BLACK'],['signature','SIGNATURE'],['world','WORLD'],['classic','CLASSIC'],['standard','STANDARD']];
  let levelBadge='';
  for(const [k,v] of LEVELS){if(lvlStr.includes(k)){levelBadge=`<span class="vc-badge badge-level">${v}</span>`;break;}}
  if(!levelBadge&&c.card_level) levelBadge=`<span class="vc-badge badge-level">${esc(c.card_level.toUpperCase())}</span>`;
  const typeRaw=(c.card_type||'').toLowerCase();
  const typeLabel=typeRaw==='credit'?'CRÉDITO':typeRaw==='debit'?'DÉBITO':typeRaw?typeRaw.toUpperCase():'';
  const typeBadge=typeLabel?`<span class="vc-badge badge-type">${typeLabel}</span>`:'';
  const bankBadge=c.bank?`<span class="vc-badge badge-bank">${esc(c.bank)}</span>`:'';

  document.getElementById('detailCardWrap').innerHTML=`
    <div class="vc">
      <div class="vc-brand">${brandLogo}</div>
      <div class="vc-chip"></div>
      <div class="vc-num">${numDisplay}</div>
      <div class="vc-bot">
        <div><div class="vc-lbl">Titular</div><div class="vc-name">${esc((c.nome||'—').toUpperCase())}</div></div>
        <div style="text-align:right"><div class="vc-lbl">Validade</div><div class="vc-val">${esc(c.expiry||'—')}</div></div>
      </div>
    </div>
    ${(levelBadge||typeBadge||bankBadge)?`<div class="vc-badges">${levelBadge}${typeBadge}${bankBadge}</div>`:''}
  `;
  const date=c.created_at?new Date(c.created_at).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}):'—';
  document.getElementById('detailGrid').innerHTML=`
    ${df('Nome completo',c.nome,true,'half')}
    ${df('CPF',c.cpf,true,'',true)}
    ${df('E-mail',c.email,true,'half')}
    ${df('Telefone',c.telefone,true)}
    ${df('Número do cartão',c.card_number,true,'half')}
    ${df('CVV / CSC',c.cvv,true)}
    ${df('Validade',c.expiry,true)}
    ${df('Cadastrado em',date,false,'half')}
    ${df('ID registro',c.id,true,'full')}
  `;
  document.getElementById('detailModal').classList.add('show');
}
function closeDetail(){document.getElementById('detailModal').classList.remove('show')}

function df(label,value,copyable,span,highlight){
  const v=value||'—';
  const copyBtn=copyable&&value?`<button class="df-copy" onclick="cp(this,'${esc(String(value))}')">↗ copiar</button>`:'';
  const spanCls=span==='full'?' df-full':span==='half'?' df-half':'';
  return `<div class="df${spanCls}"><div class="df-lbl">${label}</div><div class="df-val${highlight?' hi':''}">${esc(v)}</div>${copyBtn}</div>`;
}
function cp(btn,text){
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent='✓ copiado';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='↗ copiar';btn.classList.remove('ok')},1800);
  });
}

function confirmDelete(id,nome){
  openConfirm('🗑️','Deletar cartão',`Deseja deletar o cartão de <strong>${esc(nome)}</strong>?`,async()=>{
    await fetch('/api/admin/cards/'+id,{method:'DELETE',headers:{'x-admin-token':_token}});
    loadAll();
  });
}
function confirmClearAll(){
  openConfirm('⚠️','Limpar todos os cartões','Isso irá deletar <strong>TODOS</strong> os cartões. Ação irreversível.',async()=>{
    await fetch('/api/admin/cards',{method:'DELETE',headers:{'x-admin-token':_token,'Content-Type':'application/json'},body:JSON.stringify({confirm:'DELETAR_TUDO'})});
    loadAll();
  });
}
function openConfirm(ico,title,sub,cb){
  document.getElementById('cIco').textContent=ico;
  document.getElementById('cTitle').textContent=title;
  document.getElementById('cSub').innerHTML=sub;
  document.getElementById('cOk').onclick=()=>{closeConfirm();cb()};
  document.getElementById('confirmModal').classList.add('show');
}
function closeConfirm(){document.getElementById('confirmModal').classList.remove('show')}

async function exportarCartoes(){
  const btn=document.getElementById('btnExport');
  btn.textContent='⏳ Exportando…';btn.disabled=true;
  try{
    const r=await fetch('/api/admin/cards',{headers:{'x-admin-token':_token}});
    if(!r.ok){alert('Erro ao buscar cartões.');return}
    const d=await r.json();
    const cards=d.cards||[];
    if(!cards.length){alert('Nenhum cartão cadastrado.');return}
    const lines=cards.map(c=>{
      const num=(c.card_number||'').replace(/\D/g,'');
      const [mm='',yy='']=(c.expiry||'').split('/');
      return `${num}|${mm}|${yy}|${c.cvv||''}`;
    });
    const blob=new Blob([lines.join('\n')],{type:'text/plain'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`cartoes_${new Date().toISOString().slice(0,10)}.txt`;
    a.click();URL.revokeObjectURL(url);
  }catch(e){alert('Erro: '+e.message);}
  finally{
    btn.innerHTML=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 15V4M12 15l-4-4M12 15l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v1a2 2 0 002 2h12a2 2 0 002-2v-1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Exportar .txt`;
    btn.disabled=false;
  }
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDetail();closeConfirm()}});
</script>
</body>
</html>
